name: Build macOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    # macos-latest tourne sur Apple Silicon (M1/M2/M3).
    # Si son MacBook Air est un vieux modèle Intel d'avant 2020, remplace par : macos-13
    strategy: 
      matrix: 
        os: [macos-latest, macos-13]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compiler l'application macOS
        run: |
          pyinstaller --windowed --onedir --name "SoundCloud MP3" --collect-all imageio_ffmpeg main.py
          # On zippe le .app en conservant les permissions macOS (indispensable)
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "SoundCloud MP3.app" "SoundCloud-MP3-Mac.zip"

      - name: Publier le fichier téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-MP3-Mac
          path: dist/SoundCloud-MP3-Mac.zip