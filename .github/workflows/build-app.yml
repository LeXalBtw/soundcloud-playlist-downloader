name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release où mettre les fichiers (ex : V1.0). Vide = juste compiler."
        required: false
        default: ""
  push:
    tags: ["v*", "V*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            icon: assets/icon.icns
            sep: ":"
            mode: ""
          - os: windows-latest
            icon: assets/icon.ico
            sep: ";"
            mode: "--onefile"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python make_logo.py
      - name: Build
        run: >
          pyinstaller main.py --name "SoundCloud Downloader" --windowed --noconfirm ${{ matrix.mode }}
          --icon ${{ matrix.icon }}
          --add-data "assets${{ matrix.sep }}assets"
          --collect-all customtkinter --collect-all imageio_ffmpeg --collect-all yt_dlp
      - name: Zip macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/SoundCloud Downloader.app" SoundCloud-Downloader-mac.zip
      - name: Zip Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/SoundCloud Downloader.exe" -DestinationPath SoundCloud-Downloader-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: SoundCloud-Downloader-*.zip

  release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: SoundCloud-Downloader-*.zip
          generate_release_notes: false
